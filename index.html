<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Location Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="font-family:Arial;text-align:center;padding-top:30px">
<h3>Live location tracking started…</h3>
<p>Keep this page open</p>

<div id="status"></div>

<script>
const FORM_ACTION_URL =
  "https://docs.google.com/forms/d/e/1FAIpQLSfe-VBAXa8RRk6o1eWfB2IdQW0h3NLGhruyUGKX3BnzU0N5tg/formResponse";

// 🔴 REPLACE WITH REAL ENTRY IDS
const ENTRY_LAT  = "entry.XXXXXXXX";
const ENTRY_LNG  = "entry.YYYYYYYY";
const ENTRY_ACC  = "entry.ZZZZZZZZ";
const ENTRY_TIME = "entry.AAAAAAAA";

let lastSentTime = 0;

if (!navigator.geolocation) {
  document.getElementById("status").innerHTML =
    "Geolocation not supported ❌";
} else {

  navigator.geolocation.watchPosition(
    function(pos) {

      const now = Date.now();

      // ⏱ Send every 10 seconds (avoid spam)
      if (now - lastSentTime < 10000) return;
      lastSentTime = now;

      const lat  = pos.coords.latitude;
      const lng  = pos.coords.longitude;
      const acc  = pos.coords.accuracy;
      const time = new Date().toLocaleString();

      // 📤 Send to Google Form
      const data = new FormData();
      data.append(ENTRY_LAT, lat);
      data.append(ENTRY_LNG, lng);
      data.append(ENTRY_ACC, acc);
      data.append(ENTRY_TIME, time);

      fetch(FORM_ACTION_URL, {
        method: "POST",
        mode: "no-cors",
        body: data
      });

      // 🖥 UI update
      document.getElementById("status").innerHTML =
        "<b>LIVE LOCATION SAVED ✅</b><br>" +
        "Lat: " + lat + "<br>" +
        "Lng: " + lng + "<br>" +
        "Accuracy: " + acc + " m<br>" +
        "Time: " + time;

    },
    function(err) {
      document.getElementById("status").innerHTML =
        "Location error ❌<br>" + err.message;
    },
    {
      enableHighAccuracy: true, // FORCE GPS
      maximumAge: 0,            // NO CACHED LOCATION
      timeout: 20000
    }
  );
}
</script>

</body>
</html>
